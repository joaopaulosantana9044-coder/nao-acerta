<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Você aceita?</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ebd976;
      color: #000000;
      text-align: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .botoes {
      position: relative;
      width: 400px;
      height: 150px;
    }
    .botoes > * {
      position: absolute;
      font-size: 1.1rem;
      padding: 0.7rem 1.6rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-block;
    }
    .sim {
      background: #20bd2d;
      color: #fff;
      left: 40px;
      top: 50px;
    }
    .nao {
      background: #e02828;
      color: #fffdfd;
      left: 220px;
      top: 50px;
      transition: left 0.2s, top 0.2s;
    }
    .nao:hover {
      left: 20px;
      top: 10px;
    }
    
    .resposta {
      display: none;
    }
    
    .mensagem {
      display: none;
      font-size: 1.5rem;
      margin-top: 40px;
    }
    .resposta:checked ~ .mensagem {
      display: block;
    }
  </style>
</head>
<body>
  <h1>VOCÊ SE IRRITA ATOA COMIGO?</h1>

  <input type="checkbox" id="resposta" class="resposta">

  <div class="botoes">
    <label for="resposta" class="sim">Sim</label>
    <button class="nao">Não</button>
  </div>

  <p class="mensagem">EU SEI. TE AMO! 🎉</p>
</body>
</html>
